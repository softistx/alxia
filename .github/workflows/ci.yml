name: CI

on:
  pull_request:
    # `feat/**` too: an effort built with large-feature-branch-workflow merges
    # each slice into its integration branch `feat/<slug>`, and those slices
    # are merged without waiting for a human. Without this they merged with no
    # CI at all — no tests, no artifact check.
    branches: [develop, main, 'feat/**']

# A pull request's new push supersedes its run in progress. A push to
# `develop` never would: each one is in a group of its own, by run id.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref != 'refs/heads/develop' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    # GitHub-hosted: this repository is public, so the minutes are free and
    # unlimited.
    runs-on: ubuntu-latest
    # Measured on the 50 runs up to 2026-09-27: the job took 1 to 2 minutes,
    # typecheck the longest step. Past 8 it is hung, and the six-hour default
    # would hold the runner for nothing.
    timeout-minutes: 8
    # @alxia/redis's specs run against a real Redis.
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # `changeset status --since=origin/develop` needs the base branch.
          fetch-depth: 0
      - name: Setup
        uses: ./.github/actions/setup
      # The Biome bun.lock resolved, as `bun run check` runs it locally: one
      # version, the one biome.json's $schema names, and never `latest`.
      - name: Lint code
        run: bunx biome ci
      # Build FIRST. Every package's `exports` points at `./dist/*`, so on a
      # clean checkout `@alxia/core` resolves to nothing for its dependents and
      # typecheck reports phantom TS2307s. A developer's tree always has a
      # stale `dist/` lying around, which hides this locally — it only ever
      # shows up in CI. `bun run build` goes through scripts/workspace.ts,
      # which builds each package after the siblings it depends on, so
      # building from nothing works.
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      # Per package, not one `bun test` for the whole workspace: each package's
      # `test` script writes the generated fixtures its specs import first.
      - name: Run tests
        run: bun run test
      # The build exits 0 on packages that throw the instant they are imported —
      # it happened three times in nxgt-core. This packs them, installs them as a consumer
      # does and imports every declared subpath.
      - name: Verify the built artifacts load
        run: bun run verify:artifacts
      # The docs: no broken relative link or anchor, and the code of the
      # README, "Start in 5 minutes" and the recipes type-checked, and run
      # where it has a spec (the Redis recipes use the service above). After
      # the build: the snippets import the packages through their `dist/`.
      - name: Check the docs
        run: bun run check:docs
      # A change to a package without a changeset is a change that never
      # reaches a consumer: the release workflow has nothing to version.
      #
      # Except on the release branch itself. "Version packages" is the PR that
      # *consumes* the changesets: it rewrites every version, deletes the
      # `.changeset/*.md` that justified them, and so trips this check on its
      # own output. Requiring a changeset there would mean requiring one for
      # the act of releasing.
      - name: Changeset present
        if: github.head_ref != 'changeset-release/develop'
        run: bun run changeset:status

  newest-peers:
    # The job above runs the lockfile's toolchain: the first alternative of
    # each peer range. This one runs the last — TypeScript 7 for
    # `typescript: ^6.0.3 || ^7.0.0`, graphql 17 for @alxia/graphql — so a
    # widened range stays true after the one check that widened it. It
    # resolves without a lockfile, so an upstream release can turn it red
    # with no change here: read it, do not make it a required check.
    name: Newest peers
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      redis:
        image: redis:7.4
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    env:
      REDIS_URL: redis://localhost:6379
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      # Rewrites the manifests in this checkout only, then installs what they
      # now name: the lockfile is for the other end, so no --frozen-lockfile.
      - name: Use the newest peers
        run: bun scripts/newest-peers.ts && bun install
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      - name: Run tests
        run: bun run test
      - name: Verify the built artifacts load
        run: bun run verify:artifacts

  newest-majors:
    # "Newest peers" proves the peer ranges as written. This one tries what
    # npm calls `latest` for each widened peer — TypeScript 7 and graphql 17
    # today, the same as above — so the day TypeScript 8 or graphql 18 ships,
    # it is built against before any range accepts it, and the step below
    # warns that it is ahead (or behind, when `latest` trails the ranges).
    # No bun.lock either: nothing else stays pinned, so this one is noisier.
    # Informational like the job above: read it, do not make it required.
    # No tests, so no Redis: green here means it builds, typechecks and
    # loads. A change in behaviour shows only once a range is widened and
    # the job above runs the specs on it.
    name: Newest majors
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Use the newest majors
        run: rm bun.lock && bun scripts/newest-majors.ts && bun install
      - name: Build packages
        run: bun run build
      - name: Type checking
        run: bun run typecheck
      - name: Verify the built artifacts load
        run: bun run verify:artifacts

  templates:
    # `bun create @alxia` as a user runs it, from this checkout's packed
    # tarballs, served by a registry on localhost that passes the rest to
    # npm's: each template is written, installed, typechecked, tested and
    # built, its production server answered, then its Dockerfile built and
    # the image answered too. What is not alxia's —
    # React Router, TypeScript, Vite — comes from npm at the newest
    # versions @alxia/create resolves, so an upstream release can turn it red
    # with no change here: informational, like the two jobs above. Measured
    # locally in a few minutes, most of it the four docker builds.
    name: Templates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup
        uses: ./.github/actions/setup
      - name: Build packages
        run: bun run build
      - name: Create each template and run it
        run: bun run verify:templates
